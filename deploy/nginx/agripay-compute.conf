# AgriPay Compute Backend — nginx reverse proxy
#
# Place this file at /etc/nginx/sites-available/agripay-compute
# Then:  sudo ln -s /etc/nginx/sites-available/agripay-compute /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: Cloudflare Tunnel terminates TLS and forwards HTTP to this nginx.
#       This config listens on port 8080 (HTTP) and proxies to Docker containers.

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

server {
    listen 8080;
    server_name _;

    # Max upload size for drone imagery (10 GB)
    client_max_body_size 10g;

    # Timeouts for large uploads and processing
    # 10 GB at ~10 MB/s (slow campus network) = ~1000 seconds, so allow 2 hours.
    proxy_connect_timeout 30s;
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Compute Backend API (FastAPI at localhost:8001) ----

    # Health check (no rate limit)
    location /health {
        proxy_pass http://127.0.0.1:8001;
    }

    # Single-POST imagery upload — rate-limited
    location = /api/v1/imagery/upload {
        limit_req zone=upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_request_buffering off;
    }

    # Chunked upload endpoints — no rate limit, streaming
    location /api/v1/imagery/upload/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_request_buffering off;
    }

    # Imagery management
    location /api/v1/imagery/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    # ML / Verification API
    location /api/v1/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    # Upload compat endpoint (browser file upload + job polling)
    location /upload {
        limit_req zone=upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_request_buffering off;
    }

    location /status/ {
        proxy_pass http://127.0.0.1:8001;
    }

    location /download/ {
        proxy_pass http://127.0.0.1:8001;
    }

    # ---- TiTiler (COG tile server at localhost:8000) ----

    location /cog/ {
        # Handle CORS preflight (OPTIONS) before proxying — tile requests are cross-origin
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' '*';
            add_header 'Access-Control-Max-Age'       86400;
            add_header 'Content-Type'                 'text/plain';
            add_header 'Content-Length'               0;
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;

        # Strip TiTiler's own CORS header to avoid duplicate values, then set ours.
        # 'always' ensures the header is present on error responses too.
        proxy_hide_header 'Access-Control-Allow-Origin';
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Cache-Control' 'public, max-age=3600' always;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8000;
    }

    # Default — return 404
    location / {
        return 404 '{"error": "Not found"}';
        add_header Content-Type application/json;
    }
}
